name: عرض تجريبي (GitHub Pages)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز الموقع
        uses: actions/configure-pages@v5

      - name: رفع ملفات الواجهة
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
